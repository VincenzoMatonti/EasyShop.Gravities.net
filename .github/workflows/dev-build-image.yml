name: Build DEV Image

on:
  workflow_run:
    workflows:
      - CI DEV
    types:
      - completed

jobs:
  build-image:
    name: Build and Push DEV Image

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image

        run: |

          IMAGE_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker build \
            -f infra/docker/dev/Dockerfile \
            -t ghcr.io/$IMAGE_NAME/easyshop-app:${{ github.sha }} .

      - name: Push Image

        run: |

          IMAGE_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker push \
            ghcr.io/$IMAGE_NAME/easyshop-app:${{ github.sha }}
