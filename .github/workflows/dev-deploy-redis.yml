name: Deploy DEV Redis

on:
  workflow_run:
    workflows:
      - CI DEV
    types:
      - completed

jobs:
  deploy-redis:
    environment: redis.dev

    name: Deploy DEV Redis

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: [self-hosted, private, background]

    permissions:
      contents: read

    steps:
      # Checkout repository
      - name: Checkout repository

        uses: actions/checkout@v4

      # Runner check
      - name: Check runner

        run: |

          hostname

          docker ps

      # Prepare Redis directories
      - name: Prepare Redis directories

        run: |


          mkdir -p \
            /var/www/easyshop-redis/shared/data


          mkdir -p \
            /var/www/easyshop-redis/shared/config


          mkdir -p \
            /var/www/easyshop-redis/shared/scripts

      # Install Redis configuration
      - name: Install Redis configuration

        run: |

          cp \
            infra/redis/dev/redis.conf \
            /var/www/easyshop-redis/shared/config/redis.conf

      # Deploy Redis container
      - name: Deploy Redis

        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

        run: |
          echo "Deploying Redis"

          docker pull redis:8-alpine

          docker stop easyshop-redis || true

          docker rm easyshop-redis || true

          docker run -d \
          --name easyshop-redis \
          --network easyshop-network \
          --restart unless-stopped \
          --health-cmd "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" \
          --health-interval 30s \
          --health-timeout 5s \
          --health-retries 3 \
          -v /var/www/easyshop-redis/shared/data:/data \
          -v /var/www/easyshop-redis/shared/config/redis.conf:/usr/local/etc/redis/redis.conf:ro \
          -p 10.0.1.144:6379:6379 \
          redis:8-alpine \
          redis-server /usr/local/etc/redis/redis.conf \
          --requirepass "${REDIS_PASSWORD}"

      # Verify Redis
      - name: Redis health check

        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

        run: |

          sleep 5

          docker exec \
            easyshop-redis \
            redis-cli \
            -a "${REDIS_PASSWORD}" \
            ping

      # Show container status
      - name: Redis status

        run: |

          docker ps

      # Cleanup
      - name: Cleanup Docker images

        run: |

          docker image prune -f \
            --filter "until=168h"
