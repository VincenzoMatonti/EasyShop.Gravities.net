name: CI DEV

on:
  push:
    branches:
      - dev

jobs:
  ci:
    environment: dev
    name: DEV Code Validation

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: ecommerce_test
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ecommerce_test
      DB_USERNAME: sail
      DB_PASSWORD: password

      # Upstash Redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      REDIS_SCHEME: tls

      # Cloudflare R2
      FILESYSTEM_DISK: r2

      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_USE_PATH_STYLE_ENDPOINT: true

      # Resend
      MAIL_MAILER: resend
      MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./docker"

      - name: Validate Docker entrypoint
        run: |
          test -f infra/docker/dev/entrypoint.sh
          test -x infra/docker/dev/entrypoint.sh
          bash -n infra/docker/dev/entrypoint.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring,bcmath,pdo_mysql,redis
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check database migration status
        run: php artisan migrate:status

      - name: Check Redis connection
        run: |
          php artisan tinker --execute="
          dump(config('database.redis.default'));
          if (config('database.redis.default.host')) {
              dump(app('redis')->ping());
          } else {
              dump('Redis skipped');
          }
          "

      - name: Check Cloudflare R2 connection
        run: |
          php artisan tinker --execute='
            dump(config("filesystems.default"));
            dump(config("filesystems.disks.r2"));
            Storage::disk("r2")->put("ci/test.txt", "test");
            dump(Storage::disk("r2")->exists("ci/test.txt"));
            dump(Storage::disk("r2")->get("ci/test.txt"));
            Storage::disk("r2")->delete("ci/test.txt");
            dump(Storage::disk("r2")->exists("ci/test.txt"));
            '

      - name: Check Resend configuration
        run: |
          php artisan tinker --execute="
          dump(config('mail.default'));
          dump(config('services.resend.key') !== null);
          "

      - name: Verify Laravel optimization
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
