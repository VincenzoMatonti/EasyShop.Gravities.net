name: Deploy DEV


on:
  workflow_run:
    workflows:
      - CI DEV
    types:
      - completed


jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest


    steps:

      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"